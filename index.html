<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuscript Portal</title>
<style>
  :root { --ink:#1c1c28; --muted:#666a7a; --line:#dcdde6; --accent:#4b2e83; --bg:#ffffff; --soft:#f6f6fa; --del:#fdecec; --ins:#e9f7ec; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 "Helvetica Neue", Arial, "Hiragino Sans", "PingFang SC", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; margin: 32px 0 12px; }
  p.sub { color: var(--muted); margin: 0 0 28px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:20px; background:var(--bg); }
  label { display:block; font-size:14px; color:var(--muted); margin:14px 0 6px; }
  input[type=text], input[type=password], select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; color:var(--ink); }
  input[type=file] { font: inherit; }
  button { margin-top:18px; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .status { margin-top:14px; font-size:14px; color:var(--muted); min-height: 1.4em; }
  .status.err { color:#b3261e; }
  .notice { font-size:13px; color:var(--muted); background:var(--soft); border-radius:8px; padding:10px 12px; margin-top:18px; }
  .edit { border:1px solid var(--line); border-radius:8px; margin:10px 0; overflow:hidden; font-size:14px; }
  .edit div { padding:8px 12px; white-space:pre-wrap; word-break:break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size:13px; }
  .edit .old { background:var(--del); }
  .edit .new { background:var(--ins); }
  .edit .why { font-family: inherit; color:var(--muted); background:var(--soft); }
  pre.review { white-space:pre-wrap; word-break:break-word; font:inherit; margin:0; }
  .hidden { display:none; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .who { font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Manuscript Portal</h1>
    <div class="who hidden" id="who"></div>
  </div>
  <p class="sub">Language polishing and referee-style review for LaTeX manuscripts.</p>

  <!-- Login -->
  <section class="card" id="loginView">
    <label for="user">Username</label>
    <input type="text" id="user" autocomplete="username">
    <label for="pass">Password</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button id="loginBtn">Log in</button>
    <div class="status" id="loginStatus"></div>
  </section>

  <!-- Upload -->
  <section class="card hidden" id="appView">
    <label for="file">Manuscript (.tex, .txt or .docx)</label>
    <input type="file" id="file" accept=".tex,.txt,.docx,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
    <label for="mode">Task</label>
    <select id="mode">
      <option value="polish">Polish language (returns revised file and a change list)</option>
      <option value="review">Review (returns a referee-style report)</option>
    </select>
    <div class="row">
      <button id="runBtn">Submit</button>
      <button class="ghost" id="logoutBtn">Log out</button>
    </div>
    <div class="status" id="runStatus"></div>
    <div class="notice">
      Uploaded text and results are stored in the administrator's Google Drive and are sent to the
      Anthropic API for processing. Processing takes 1 to 5 minutes. Keep this page open.
    </div>
  </section>

  <!-- Results -->
  <section class="hidden" id="resultView">
    <h2 id="resultTitle"></h2>
    <div class="row">
      <button id="dlBtn" class="hidden">Download revised file</button>
      <button id="dlReviewBtn" class="hidden">Download report</button>
    </div>
    <div id="resultBody" style="margin-top:16px"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// Paste the Apps Script web app URL here (it ends with /exec).
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyMPCW8XBoolVwUI_SpiViT3k5KojULj4TwmyOAR4ElwjXdMODygcsof8hxQUJyo9ew/exec';

const $ = (id) => document.getElementById(id);
let token = null, username = null, lastResult = null, lastName = 'manuscript.tex', lastDocx = null;

function store(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function setStatus(el, msg, isErr) { el.textContent = msg || ''; el.classList.toggle('err', !!isErr); }

// text/plain body keeps this a "simple" request, which Apps Script requires (no CORS preflight).
async function api(payload) {
  const r = await fetch(BACKEND_URL, { method: 'POST', body: JSON.stringify(payload) });
  if (!r.ok) throw new Error('Server error (HTTP ' + r.status + ')');
  const data = await r.json();
  if (!data.ok) throw new Error(data.error || 'Unknown error');
  return data;
}

function showApp() {
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('who').classList.remove('hidden');
  $('who').textContent = 'Signed in as ' + username;
}

function logout() {
  token = username = null; store('mp_token', null); store('mp_user', null);
  $('appView').classList.add('hidden'); $('resultView').classList.add('hidden');
  $('who').classList.add('hidden'); $('loginView').classList.remove('hidden');
}

$('loginBtn').onclick = async () => {
  const st = $('loginStatus');
  $('loginBtn').disabled = true; setStatus(st, 'Checking...');
  try {
    const d = await api({ action: 'login', username: $('user').value.trim(), password: $('pass').value });
    token = d.token; username = d.username;
    store('mp_token', token); store('mp_user', username);
    $('pass').value = ''; setStatus(st, ''); showApp();
  } catch (e) { setStatus(st, e.message, true); }
  $('loginBtn').disabled = false;
};
$('pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').onclick = logout;

$('runBtn').onclick = async () => {
  const st = $('runStatus');
  const f = $('file').files[0];
  if (!f) { setStatus(st, 'Choose a file first.', true); return; }
  const mode = $('mode').value;
  $('runBtn').disabled = true; $('resultView').classList.add('hidden');
  const t0 = Date.now();
  const timer = setInterval(() => setStatus(st, 'Processing... ' + Math.round((Date.now() - t0) / 1000) + ' s'), 1000);
  try {
    lastName = f.name;
    lastDocx = null;
    let text;
    if (/\.docx$/i.test(f.name)) {
      lastDocx = await readDocx(f);
      text = lastDocx.text;
    } else {
      text = await f.text();
    }
    const { jobId } = await api({ action: 'start', token, mode, filename: f.name, text });
    let d;
    for (;;) {
      await sleep(6000);
      d = await api({ action: 'status', token, jobId });
      if (d.state === 'done') break;
    }
    if (lastDocx && d.mode === 'polish') d.docxBlob = await writeDocx(lastDocx, d.edits);
    lastResult = d;
    clearInterval(timer);
    setStatus(st, 'Done. Cost $' + d.cost.toFixed(3) + '. Used this month: $' + d.used.toFixed(2) + ' of $' + d.limit + '.');
    render(d);
  } catch (e) {
    clearInterval(timer);
    setStatus(st, e.message, true);
    if (/log in again/i.test(e.message)) logout();
  }
  $('runBtn').disabled = false;
};


// ---- Word (.docx) support: text is extracted in the browser, edits are written back into the original XML ----
const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

async function readDocx(file) {
  if (!window.JSZip) throw new Error('Word support failed to load. Reload the page and try again.');
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const entry = zip.file('word/document.xml');
  if (!entry) throw new Error('Not a valid .docx file');
  const xml = await entry.async('string');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Could not parse the Word document');
  const paras = Array.from(doc.getElementsByTagNameNS(W_NS, 'p'));
  const text = paras.map((p) => Array.from(p.getElementsByTagNameNS(W_NS, 't')).map((t) => t.textContent).join('')).join('\n\n');
  return { zip, doc, paras, text };
}

// Applies each edit inside the paragraph that contains it. If the old text sits in one run, only that
// run changes; if it spans several runs, the paragraph's text is merged into its first run (formatting
// inside that paragraph is lost, but the rest of the document is untouched).
async function writeDocx(d, edits) {
  let applied = 0, manual = [];
  edits.forEach((ed) => {
    let done = false;
    for (const p of d.paras) {
      const ts = Array.from(p.getElementsByTagNameNS(W_NS, 't'));
      const single = ts.find((t) => t.textContent.includes(ed.old));
      if (single) { setT(single, single.textContent.replace(ed.old, ed.new)); done = true; break; }
      const full = ts.map((t) => t.textContent).join('');
      if (ts.length && full.includes(ed.old)) {
        setT(ts[0], full.replace(ed.old, ed.new));
        ts.slice(1).forEach((t) => setT(t, ''));
        done = true; break;
      }
    }
    if (done) applied++; else manual.push(ed);
  });
  const xml = new XMLSerializer().serializeToString(d.doc);
  d.zip.file('word/document.xml', xml);
  const blob = await d.zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  blob.applied = applied; blob.manual = manual;
  return blob;
}

function setT(t, value) {
  t.textContent = value;
  t.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
}

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function render(d) {
  const body = $('resultBody'); body.textContent = '';
  $('resultView').classList.remove('hidden');
  $('dlBtn').classList.toggle('hidden', d.mode !== 'polish');
  $('dlReviewBtn').classList.toggle('hidden', d.mode !== 'review');
  if (d.mode === 'review') {
    $('resultTitle').textContent = 'Review report';
    const card = el('div', 'card'); card.appendChild(el('pre', 'review', d.review)); body.appendChild(card);
    return;
  }
  let title = d.edits.length + ' changes applied';
  if (d.skipped) title += ', ' + d.skipped + ' could not be located and were skipped';
  $('resultTitle').textContent = title;
  if (d.truncated) body.appendChild(el('div', 'notice', 'Time limit reached: the last part of the manuscript was left unchanged. Split the file and submit the remainder separately.'));
  if (d.docxBlob) {
    let msg = d.docxBlob.applied + ' of ' + d.edits.length + ' changes were written into the Word file with formatting preserved.';
    if (d.docxBlob.manual.length) msg += ' ' + d.docxBlob.manual.length + ' could not be placed automatically and are listed first below for manual editing.';
    body.appendChild(el('div', 'notice', msg));
    const manualSet = new Set(d.docxBlob.manual);
    d.edits = d.docxBlob.manual.concat(d.edits.filter((e) => !manualSet.has(e)));
  }
  d.edits.forEach((ed) => {
    const box = el('div', 'edit');
    box.appendChild(el('div', 'old', ed.old));
    box.appendChild(el('div', 'new', ed.new));
    box.appendChild(el('div', 'why', ed.reason));
    body.appendChild(box);
  });
}

function download(name, text) { downloadBlob(name, new Blob([text], { type: 'text/plain;charset=utf-8' })); }
function downloadBlob(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('dlBtn').onclick = () => {
  if (!lastResult) return;
  const name = lastName.replace(/(\.[^.]+)?$/, '_polished$1');
  if (lastResult.docxBlob) downloadBlob(name, lastResult.docxBlob); else download(name, lastResult.revised);
};
$('dlReviewBtn').onclick = () => lastResult && download(lastName.replace(/(\.[^.]+)?$/, '_review.md'), lastResult.review);

// Restore session
token = load('mp_token'); username = load('mp_user');
if (token && username) showApp();
</script>
</body>
</html>
