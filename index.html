<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuscript Portal</title>
<style>
  :root { --ink:#1c1c28; --muted:#666a7a; --line:#dcdde6; --accent:#4b2e83; --bg:#ffffff; --soft:#f6f6fa; --del:#fdecec; --ins:#e9f7ec; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 "Helvetica Neue", Arial, "Hiragino Sans", "PingFang SC", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; margin: 32px 0 12px; }
  p.sub { color: var(--muted); margin: 0 0 28px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:20px; background:var(--bg); }
  label { display:block; font-size:14px; color:var(--muted); margin:14px 0 6px; }
  input[type=text], input[type=password], select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; color:var(--ink); }
  input[type=file] { font: inherit; }
  button { margin-top:18px; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .status { margin-top:14px; font-size:14px; color:var(--muted); min-height: 1.4em; }
  .status.err { color:#b3261e; }
  .notice { font-size:13px; color:var(--muted); background:var(--soft); border-radius:8px; padding:10px 12px; margin-top:18px; }
  .edit { border:1px solid var(--line); border-radius:8px; margin:10px 0; overflow:hidden; font-size:14px; }
  .edit div { padding:8px 12px; white-space:pre-wrap; word-break:break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size:13px; }
  .edit .old { background:var(--del); }
  .edit .new { background:var(--ins); }
  .edit .why { font-family: inherit; color:var(--muted); background:var(--soft); }
  pre.review { white-space:pre-wrap; word-break:break-word; font:inherit; margin:0; }
  .hidden { display:none; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .who { font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Manuscript Portal</h1>
    <div class="who hidden" id="who"></div>
  </div>
  <p class="sub">Language polishing and referee-style review for LaTeX manuscripts.</p>

  <!-- Login -->
  <section class="card" id="loginView">
    <label for="user">Username</label>
    <input type="text" id="user" autocomplete="username">
    <label for="pass">Password</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button id="loginBtn">Log in</button>
    <div class="status" id="loginStatus"></div>
  </section>

  <!-- Upload -->
  <section class="card hidden" id="appView">
    <label for="file">Manuscript (.tex or .txt)</label>
    <input type="file" id="file" accept=".tex,.txt,text/plain">
    <label for="mode">Task</label>
    <select id="mode">
      <option value="polish">Polish language (returns revised .tex and a change list)</option>
      <option value="review">Review (returns a referee-style report)</option>
    </select>
    <div class="row">
      <button id="runBtn">Submit</button>
      <button class="ghost" id="logoutBtn">Log out</button>
    </div>
    <div class="status" id="runStatus"></div>
    <div class="notice">
      Uploaded files and results are stored in the administrator's Google Drive and are sent to the
      Anthropic API for processing. Processing takes 1 to 4 minutes. Keep this page open.
    </div>
  </section>

  <!-- Results -->
  <section class="hidden" id="resultView">
    <h2 id="resultTitle"></h2>
    <div class="row">
      <button id="dlBtn" class="hidden">Download revised .tex</button>
      <button id="dlReviewBtn" class="hidden">Download report</button>
    </div>
    <div id="resultBody" style="margin-top:16px"></div>
  </section>
</main>

<script>
// Paste the Apps Script web app URL here (it ends with /exec).
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyMPCW8XBoolVwUI_SpiViT3k5KojULj4TwmyOAR4ElwjXdMODygcsof8hxQUJyo9ew/exec';

const $ = (id) => document.getElementById(id);
let token = null, username = null, lastResult = null, lastName = 'manuscript.tex';

function store(k, v) { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

function setStatus(el, msg, isErr) { el.textContent = msg || ''; el.classList.toggle('err', !!isErr); }

// text/plain body keeps this a "simple" request, which Apps Script requires (no CORS preflight).
async function api(payload) {
  const r = await fetch(BACKEND_URL, { method: 'POST', body: JSON.stringify(payload) });
  if (!r.ok) throw new Error('Server error (HTTP ' + r.status + ')');
  const data = await r.json();
  if (!data.ok) throw new Error(data.error || 'Unknown error');
  return data;
}

function showApp() {
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('who').classList.remove('hidden');
  $('who').textContent = 'Signed in as ' + username;
}

function logout() {
  token = username = null; store('mp_token', null); store('mp_user', null);
  $('appView').classList.add('hidden'); $('resultView').classList.add('hidden');
  $('who').classList.add('hidden'); $('loginView').classList.remove('hidden');
}

$('loginBtn').onclick = async () => {
  const st = $('loginStatus');
  $('loginBtn').disabled = true; setStatus(st, 'Checking...');
  try {
    const d = await api({ action: 'login', username: $('user').value.trim(), password: $('pass').value });
    token = d.token; username = d.username;
    store('mp_token', token); store('mp_user', username);
    $('pass').value = ''; setStatus(st, ''); showApp();
  } catch (e) { setStatus(st, e.message, true); }
  $('loginBtn').disabled = false;
};
$('pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').onclick = logout;

$('runBtn').onclick = async () => {
  const st = $('runStatus');
  const f = $('file').files[0];
  if (!f) { setStatus(st, 'Choose a file first.', true); return; }
  const mode = $('mode').value;
  $('runBtn').disabled = true; $('resultView').classList.add('hidden');
  const t0 = Date.now();
  const timer = setInterval(() => setStatus(st, 'Processing... ' + Math.round((Date.now() - t0) / 1000) + ' s'), 1000);
  try {
    const text = await f.text();
    lastName = f.name;
    const d = await api({ action: 'process', token, mode, filename: f.name, text });
    lastResult = d;
    clearInterval(timer);
    setStatus(st, 'Done. Cost $' + d.cost.toFixed(3) + '. Used this month: $' + d.used.toFixed(2) + ' of $' + d.limit + '.');
    render(d);
  } catch (e) {
    clearInterval(timer);
    setStatus(st, e.message, true);
    if (/log in again/i.test(e.message)) logout();
  }
  $('runBtn').disabled = false;
};

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function render(d) {
  const body = $('resultBody'); body.textContent = '';
  $('resultView').classList.remove('hidden');
  $('dlBtn').classList.toggle('hidden', d.mode !== 'polish');
  $('dlReviewBtn').classList.toggle('hidden', d.mode !== 'review');
  if (d.mode === 'review') {
    $('resultTitle').textContent = 'Review report';
    const card = el('div', 'card'); card.appendChild(el('pre', 'review', d.review)); body.appendChild(card);
    return;
  }
  let title = d.edits.length + ' changes applied';
  if (d.skipped) title += ', ' + d.skipped + ' could not be located and were skipped';
  $('resultTitle').textContent = title;
  if (d.truncated) body.appendChild(el('div', 'notice', 'Time limit reached: the last part of the manuscript was left unchanged. Split the file and submit the remainder separately.'));
  d.edits.forEach((ed) => {
    const box = el('div', 'edit');
    box.appendChild(el('div', 'old', ed.old));
    box.appendChild(el('div', 'new', ed.new));
    box.appendChild(el('div', 'why', ed.reason));
    body.appendChild(box);
  });
}

function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('dlBtn').onclick = () => lastResult && download(lastName.replace(/(\.[^.]+)?$/, '_polished$1'), lastResult.revised);
$('dlReviewBtn').onclick = () => lastResult && download(lastName.replace(/(\.[^.]+)?$/, '_review.md'), lastResult.review);

// Restore session
token = load('mp_token'); username = load('mp_user');
if (token && username) showApp();
</script>
</body>
</html>
